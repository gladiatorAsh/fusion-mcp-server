[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-mcp-server"
version = "0.1.0"
description = "MCP server for Autodesk Fusion: read designs, change parameters and export parts from any MCP client"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ashutosh Singh" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pydantic>=2"]
keywords = ["mcp", "model-context-protocol", "fusion", "fusion-360", "cad", "autodesk"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fusion-mcp-server = "fusion_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
